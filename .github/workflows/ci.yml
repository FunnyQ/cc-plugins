name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4

defaults:
  run:
    shell: bash

jobs:
  required:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx --bun tsc --noEmit
      - run: bun test packages/monitor/skills/cockpit/bin/hook.test.ts
      - if: runner.os == 'macOS'
        run: cargo build --release --locked --target aarch64-apple-darwin --manifest-path packages/monitor/cockpit-rs/Cargo.toml
      - if: runner.os != 'Windows'
        run: bun test packages/monitor/skills/cockpit/bin/cockpit.test.ts
      - if: runner.os == 'Windows'
        run: "! grep -q $'\\r' packages/monitor/skills/cockpit/bin/cockpit"
      # The flag replaces bunfig's pathIgnorePatterns, so the mod-test pattern is repeated here.
      - run: bun test --parallel packages/chronicle packages/dispatch packages/guard packages/relay packages/browsers packages/herdr opencode/ ./.github/scripts/browser-smoke.test.ts --path-ignore-patterns='**/*.live.test.ts' --path-ignore-patterns='**/*.mod.test.ts'
      # Real browsers, one file at a time: under --parallel a launch timed out on a loaded runner.
      - run: bun test ./packages/browsers/skills/chrome/scripts/chrome.live.test.ts ./packages/browsers/skills/firefox/scripts/firefox.live.test.ts ./packages/browsers/skills/safari/scripts/safari.live.test.ts
      - run: (cd packages/runes && bun test ./hooks/platform.spec.ts ./hooks/explain/themes.spec.ts)
      - run: bun .github/scripts/browser-smoke.ts

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun .github/scripts/smoke.ts

  report:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/monitor/cockpit-rs
      - if: runner.os != 'Windows'
        continue-on-error: true
        run: cargo build --release --manifest-path packages/monitor/cockpit-rs/Cargo.toml
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo check --manifest-path packages/monitor/cockpit-rs/Cargo.toml
      # bun 1.4.4 still prints (fail) lines to the console with --reporter=junit, so one run serves log and artifact.
      - if: always()
        run: |
          set +e
          bun test --parallel . --reporter=junit --reporter-outfile=junit-${{ matrix.os }}.xml 2>&1 | tee bun-test.log
          code=${PIPESTATUS[0]}
          {
            echo "## bun test — ${{ matrix.os }} (exit $code)"
            if [ "$code" = 0 ]; then
              echo "no failures"
            else
              grep '(fail)' bun-test.log
              grep -E '^ *[0-9]+ (fail|errors?)$' bun-test.log
              grep -A4 'Unhandled error' bun-test.log | head -200
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-${{ matrix.os }}
          path: |
            junit-${{ matrix.os }}.xml
            bun-test.log
