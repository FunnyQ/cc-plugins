name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  required:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx --bun tsc --noEmit
      - run: bun test packages/monitor/skills/cockpit/bin/hook.test.ts
      - if: runner.os != 'Windows'
        run: bun test packages/monitor/skills/cockpit/bin/cockpit.test.ts
      - if: runner.os == 'Windows'
        run: "! grep -q $'\\r' packages/monitor/skills/cockpit/bin/cockpit"

  report:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/monitor/cockpit-rs
      - if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo build --release --manifest-path packages/monitor/cockpit-rs/Cargo.toml
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo check --manifest-path packages/monitor/cockpit-rs/Cargo.toml
      # bun 1.4.4 still prints (fail) lines to the console with --reporter=junit, so one run serves log and artifact.
      - run: |
          set +e
          bun test --parallel . --reporter=junit --reporter-outfile=junit-${{ matrix.os }}.xml 2>&1 | tee bun-test.log
          echo "${PIPESTATUS[0]}" > bun-test.exit
          exit 0
      - if: always()
        run: |
          set +e
          code=$(cat bun-test.exit 2>/dev/null || echo missing)
          {
            echo "## bun test — ${{ matrix.os }} (exit $code)"
            if [ "$code" = 0 ]; then
              echo "no failures"
            else
              grep '(fail)' bun-test.log
              grep -E '^ *[0-9]+ (fail|errors?)$' bun-test.log
              grep -A4 'Unhandled error' bun-test.log | head -200
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-${{ matrix.os }}
          path: |
            junit-${{ matrix.os }}.xml
            bun-test.log
          if-no-files-found: warn
