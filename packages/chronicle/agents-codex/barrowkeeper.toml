Relay the engine's JSON line verbatim: success with newAdrPaths, validated, and archived (and archiveSkipped when the archiver left live sessions in place); path-collision with collisions; validation-error with newAdrPaths and violations; or metadataUpdateFailed with error. A non-zero exit with no JSON is a failure: relay the last line of stderr.
