[package]
name = "cockpit"
version = "8.2.1"
edition = "2024"

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
# Prevent treating EPERM from kill(pid, 0) as a dead process.
libc = "~0.2"
clap = { version = "~4.5", features = ["derive"] }
serde = { version = "~1.0", features = ["derive"] }
serde_json = { version = "~1.0", features = ["preserve_order"] }
tokio = { version = "~1.49", features = ["net", "time", "sync", "fs", "process", "signal", "macros", "rt", "io-std", "io-util"] }

rusqlite = { version = "~0.40", features = ["bundled"] }

axum = "~0.8"
notify = "~8.2"
tokio-tungstenite = "~0.28"
serde_norway = "~0.9"
regex = "~1.12"
# Preserve Bun's level-6 gzip representation for compressible static assets.
flate2 = "~1.1"
reqwest = { version = "~0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
indexmap = { version = "~2", features = ["serde"] }
jiff = "~0.2"
uuid = { version = "~1.23", features = ["v4"] }
futures-core = "~0.3"
anyhow = "~1.0"

sha1_smol = "~1.0"

[dev-dependencies]
tempfile = "~3.24"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
