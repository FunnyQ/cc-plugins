<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" font-family="'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFDFE"/>
      <stop offset="1" stop-color="#ECF3F6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#21455A" flood-opacity="0.14"/>
    </filter>
    <marker id="ah-ink" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#33485A"/></marker>
    <marker id="ah-teal" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#1FA7B0"/></marker>
    <marker id="ah-green" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#2F9C70"/></marker>
    <marker id="ah-indigo" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#6473D7"/></marker>
    <marker id="ah-amber" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#D9852E"/></marker>
    <marker id="ah-red" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#C9603F"/></marker>
    <marker id="ah-slate" markerWidth="11" markerHeight="11" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3 L0,6 Z" fill="#7E96A6"/></marker>
    <style>
      .ink{fill:#1B2A36}.mut{fill:#5E7686}.wt{fill:#fff}
      .h1{font-size:26px;font-weight:700}
      .sub{font-size:13px}
      .sec{font-size:12px;font-weight:700;letter-spacing:1.2px}
      .ntitle{font-size:19px;font-weight:700}
      .q{font-size:12.5px;font-style:italic}
      .role{font-size:13.5px}.role2{font-size:12px}
      .nlbl{font-size:13px;font-weight:600}.nsub{font-size:10.5px}
      .tag{font-size:11px;font-weight:600}
      .chip{font-size:12px;font-weight:600}
      .mc{font-size:11px;font-weight:700}
      .note{font-size:11.5px}
      .ln{stroke-width:2;fill:none}
      .lo{fill:#E4F3F4;stroke:#9ED6DA}.lo-t{fill:#16808A}
      .me{fill:#EEF0FF;stroke:#BDC4F4}.me-t{fill:#4F5EC4}
      .hi{fill:#F3E8F8;stroke:#D5B6E6}.hi-t{fill:#7E3FA0}
      .na{fill:#EEF3F6;stroke:#D2DFE6}.na-t{fill:#5E7686}
    </style>
  </defs>

  <rect width="1320" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text class="h1 ink" x="60" y="50">Dispatch — pick the altitude, then fly</text>
  <text class="sub mut" x="61" y="76">Plan only as heavily as the work needs. Hand a frozen plan to autopilot, which builds cheap and spends its effort hunting what the build missed.</text>

  <!-- ===== 1 · CHOOSE THE ALTITUDE ===== -->
  <text class="sec mut" x="60" y="112">1 · CHOOSE THE ALTITUDE</text>

  <!-- Card: preflight -->
  <g filter="url(#soft)"><rect x="60" y="124" width="282" height="152" rx="14" fill="#fff" stroke="#D7E3EA"/></g>
  <rect x="60" y="124" width="6" height="152" rx="3" fill="#7E96A6"/>
  <text class="q mut" x="82" y="148">Know the want, not the how?</text>
  <text class="ntitle ink" x="82" y="182">preflight</text>
  <rect x="176" y="167" width="54" height="20" rx="10" fill="#EAF1F4"/><text class="tag" fill="#5E7686" x="203" y="181" text-anchor="middle">intent</text>
  <text class="role ink" x="82" y="224">→ INTENT.md · minutes</text>
  <text class="role2 mut" x="82" y="250">no solution chosen; hop and</text>
  <text class="role2 mut" x="82" y="266">flightplan read it as their baseline</text>

  <!-- Card: hop -->
  <g filter="url(#soft)"><rect x="366" y="124" width="282" height="152" rx="14" fill="#fff" stroke="#D7E3EA"/></g>
  <rect x="366" y="124" width="6" height="152" rx="3" fill="#35CAD2"/>
  <text class="q mut" x="388" y="148">Small scope, doing it now?</text>
  <text class="ntitle ink" x="388" y="182">hop</text>
  <rect x="428" y="167" width="62" height="20" rx="10" fill="#E6F6F7"/><text class="tag" fill="#1FA7B0" x="459" y="181" text-anchor="middle">in chat</text>
  <text class="role ink" x="388" y="224">→ interview · plan · run</text>
  <text class="role2 mut" x="388" y="250">you stay in the loop; optional</text>
  <text class="role2 mut" x="388" y="266">closing review of the diff at</text>
  <rect x="557" y="255" width="74" height="16" rx="8" class="hi"/><text class="mc hi-t" x="594" y="267" text-anchor="middle">opus · high</text>

  <!-- Card: flightplan -->
  <g filter="url(#soft)"><rect x="672" y="124" width="282" height="152" rx="14" fill="#fff" stroke="#D7E3EA"/></g>
  <rect x="672" y="124" width="6" height="152" rx="3" fill="#1FA7B0"/>
  <text class="q mut" x="694" y="148">A feature to hand off?</text>
  <text class="ntitle ink" x="694" y="182">flightplan</text>
  <rect x="793" y="167" width="76" height="20" rx="10" fill="#E6F6F7"/><text class="tag" fill="#1FA7B0" x="831" y="181" text-anchor="middle">blueprint</text>
  <text class="role ink" x="694" y="224">→ PLAN.md + tasks/ tree</text>
  <text class="role2 mut" x="694" y="250">every task carries a rubric; the plan</text>
  <text class="role2 mut" x="694" y="266">is reviewed by codex or</text>
  <rect x="834" y="255" width="74" height="16" rx="8" class="hi"/><text class="mc hi-t" x="871" y="267" text-anchor="middle">opus · high</text>

  <!-- Card: waypoints -->
  <g filter="url(#soft)"><rect x="978" y="124" width="282" height="152" rx="14" fill="#fff" stroke="#D7E3EA"/></g>
  <rect x="978" y="124" width="6" height="152" rx="3" fill="#6473D7"/>
  <text class="q mut" x="1000" y="148">Many milestones ahead?</text>
  <text class="ntitle ink" x="1000" y="182">waypoints</text>
  <rect x="1106" y="167" width="68" height="20" rx="10" fill="#EEF0FF"/><text class="tag" fill="#6473D7" x="1140" y="181" text-anchor="middle">roadmap</text>
  <text class="role ink" x="1000" y="224">→ WAYPOINTS.md + legs</text>
  <text class="role2 mut" x="1000" y="250">plans each leg just in time,</text>
  <text class="role2 mut" x="1000" y="266">after the previous one lands</text>

  <!-- scope axis -->
  <line x1="60" y1="298" x2="700" y2="298" stroke="#9AB0BD" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <text class="note mut" x="62" y="316">more scope, longer hand-off →</text>

  <!-- waypoints → flightplan, one tree per leg -->
  <path class="ln" d="M1119,276 L1119,298 L873,298 L873,280" stroke="#6473D7" marker-end="url(#ah-indigo)"/>
  <text class="note" fill="#6473D7" x="900" y="316">one flightplan per leg</text>

  <!-- flightplan → autopilot -->
  <path class="ln" d="M783,276 L783,340" stroke="#1FA7B0" marker-end="url(#ah-teal)"/>
  <text class="note" fill="#1FA7B0" x="792" y="328">autopilot runs the tree</text>

  <!-- ===== 2 · AUTOPILOT ===== -->
  <g filter="url(#soft)"><rect x="60" y="344" width="1200" height="456" rx="14" fill="#fff" stroke="#D7E3EA"/></g>
  <text class="sec mut" x="84" y="374">2 · AUTOPILOT FLIES THE TREE</text>
  <text class="note mut" x="84" y="394">Each wave, next-ready scouts the tasks whose dependencies are done. They run in parallel, each in its own git worktree, and the wave is committed before the next scout.</text>

  <!-- left: the tree -->
  <text class="nlbl ink" x="84" y="426">tasks/ tree</text>
  <rect x="84" y="436" width="248" height="28" rx="8" fill="#EAF1F4" stroke="#D2DFE6"/>
  <text class="chip ink" x="98" y="455">PLAN.md · _context/ rubric</text>
  <text class="note mut" x="86" y="486">tasks/&lt;bucket-a&gt;/</text>
  <rect x="84" y="494" width="76" height="26" rx="8" fill="#EFF7F8" stroke="#BFE4E7"/><text class="chip ink" x="98" y="512">01 ⓡ</text>
  <rect x="168" y="494" width="76" height="26" rx="8" fill="#EFF7F8" stroke="#BFE4E7"/><text class="chip ink" x="182" y="512">02 ⓡ</text>
  <rect x="252" y="494" width="76" height="26" rx="8" fill="#EFF7F8" stroke="#BFE4E7"/><text class="chip ink" x="266" y="512">03 ⓡ</text>
  <text class="note mut" x="86" y="542">tasks/&lt;bucket-b&gt;/</text>
  <rect x="84" y="550" width="76" height="26" rx="8" fill="#EFF7F8" stroke="#BFE4E7"/><text class="chip ink" x="98" y="568">01 ⓡ</text>
  <rect x="168" y="550" width="76" height="26" rx="8" fill="#EFF7F8" stroke="#BFE4E7"/><text class="chip ink" x="182" y="568">02 ⓡ</text>
  <rect x="84" y="592" width="248" height="28" rx="8" fill="#FBF1E4" stroke="#E7C79B"/>
  <text class="chip" fill="#B5701E" x="98" y="611">final-review · depends on all</text>
  <text class="note mut" x="84" y="646">ⓡ = the task's ## Eval rubric</text>
  <text class="note mut" x="84" y="668">A task with dense hidden edge cases</text>
  <text class="note mut" x="84" y="686">can raise its own dev effort:</text>
  <rect x="84" y="694" width="160" height="20" rx="10" class="hi"/><text class="mc hi-t" x="164" y="708" text-anchor="middle">Models: dev=opus/high</text>
  <text class="note mut" x="84" y="736">An ambiguous task gets a sharper</text>
  <text class="note mut" x="84" y="754">spec instead: effort cannot fix</text>
  <text class="note mut" x="84" y="772">a wrong reading.</text>

  <!-- ready → dev -->
  <path class="ln" d="M336,452 L370,452" stroke="#2F9C70" marker-end="url(#ah-green)"/>
  <text class="note mut" x="336" y="444">ready</text>

  <!-- pipeline: Dev → Binary gate → Rubric judge → Score gate -->
  <rect x="372" y="414" width="180" height="78" rx="10" fill="#F4FBFB" stroke="#BFE4E7"/>
  <text class="nlbl ink" x="462" y="436" text-anchor="middle">Dev</text>
  <text class="nsub mut" x="462" y="452" text-anchor="middle">writes the task, runs its checks</text>
  <rect x="423" y="462" width="78" height="20" rx="10" class="lo"/><text class="mc lo-t" x="462" y="476" text-anchor="middle">opus · low</text>
  <line class="ln" x1="554" y1="452" x2="582" y2="452" stroke="#33485A" marker-end="url(#ah-ink)"/>

  <rect x="584" y="414" width="180" height="78" rx="10" fill="#F4FBFB" stroke="#BFE4E7"/>
  <text class="nlbl ink" x="674" y="436" text-anchor="middle">Binary gate</text>
  <text class="nsub mut" x="674" y="452" text-anchor="middle">re-runs ## Verification + criteria</text>
  <rect x="635" y="462" width="78" height="20" rx="10" class="lo"/><text class="mc lo-t" x="674" y="476" text-anchor="middle">opus · low</text>
  <line class="ln" x1="766" y1="452" x2="794" y2="452" stroke="#33485A" marker-end="url(#ah-ink)"/>

  <rect x="796" y="414" width="180" height="78" rx="10" fill="#F4FBFB" stroke="#BFE4E7"/>
  <text class="nlbl ink" x="886" y="436" text-anchor="middle">Rubric judge</text>
  <text class="nsub mut" x="886" y="452" text-anchor="middle">scores against the gate's evidence</text>
  <rect x="838" y="462" width="96" height="20" rx="10" class="me"/><text class="mc me-t" x="886" y="476" text-anchor="middle">opus · medium</text>
  <line class="ln" x1="978" y1="452" x2="1006" y2="452" stroke="#33485A" marker-end="url(#ah-ink)"/>

  <rect x="1008" y="414" width="180" height="78" rx="10" fill="#F4FBFB" stroke="#BFE4E7"/>
  <text class="nlbl ink" x="1098" y="442" text-anchor="middle">Score gate</text>
  <text class="nsub mut" x="1098" y="460" text-anchor="middle">weighted average + veto</text>
  <text class="nsub mut" x="1098" y="476" text-anchor="middle">script, no model</text>

  <!-- fail → back to dev -->
  <path class="ln" d="M1040,492 L1040,528 L462,528 L462,496" stroke="#C9603F" marker-end="url(#ah-red)"/>
  <text class="note" fill="#C9603F" x="560" y="520">fail → the rejection feeds the next dev attempt</text>

  <!-- retry ladder -->
  <rect x="372" y="552" width="392" height="96" rx="10" fill="#FCF6F4" stroke="#EBCBBF"/>
  <text class="nlbl" fill="#B2522F" x="388" y="574">Dev retry ladder</text>
  <text class="note ink" x="388" y="596">attempts 1 … n−1</text>
  <rect x="520" y="584" width="78" height="18" rx="9" class="lo"/><text class="mc lo-t" x="559" y="597" text-anchor="middle">opus · low</text>
  <text class="note ink" x="388" y="618">last attempt</text>
  <rect x="520" y="606" width="80" height="18" rx="9" class="hi"/><text class="mc hi-t" x="560" y="619" text-anchor="middle">opus · high</text>
  <text class="note mut" x="608" y="619">or the task's dev= +1</text>
  <text class="note mut" x="388" y="640">codex / opencode can write instead, driven by</text>
  <rect x="660" y="628" width="78" height="18" rx="9" class="lo"/><text class="mc lo-t" x="699" y="641" text-anchor="middle">opus · low</text>

  <!-- park -->
  <text class="note mut" x="784" y="574">Past the attempt cap: park the task,</text>
  <text class="note mut" x="784" y="592">keep flying independent work,</text>
  <text class="note mut" x="784" y="610">then hand the parked task back to you.</text>

  <!-- pass → done → wave commit -->
  <line class="ln" x1="1098" y1="492" x2="1098" y2="552" stroke="#2F9C70" marker-end="url(#ah-green)"/>
  <text class="note" fill="#2F9C70" x="1106" y="520">pass</text>
  <rect x="1028" y="554" width="140" height="34" rx="9" fill="#E9F7F0" stroke="#A9DCC4"/>
  <text class="chip" fill="#2F9C70" x="1098" y="576" text-anchor="middle">Status: done ✓</text>
  <line class="ln" x1="1098" y1="588" x2="1098" y2="606" stroke="#2F9C70" marker-end="url(#ah-green)"/>
  <rect x="1008" y="608" width="228" height="30" rx="9" fill="#E9F7F0" stroke="#A9DCC4"/>
  <text class="chip" fill="#2F9C70" x="1122" y="628" text-anchor="middle">commit wave → scout next ↻</text>
  <rect x="1150" y="642" width="78" height="18" rx="9" class="lo"/><text class="mc lo-t" x="1189" y="655" text-anchor="middle">opus · low</text>
  <text class="note mut" x="1070" y="655">commit agent</text>

  <!-- all done → final review -->
  <line class="ln" x1="1040" y1="638" x2="1040" y2="682" stroke="#D9852E" marker-end="url(#ah-amber)"/>
  <text class="note" fill="#B5701E" x="950" y="672">all tasks done</text>

  <!-- final review -->
  <rect x="372" y="684" width="864" height="100" rx="12" fill="#FDF8F0" stroke="#E7C79B"/>
  <text class="nlbl" fill="#B5701E" x="388" y="706">Final review — the last task, run against the whole branch</text>

  <rect x="388" y="718" width="104" height="22" rx="11" class="na"/><text class="mc na-t" x="440" y="733" text-anchor="middle">codex · bugs</text>
  <rect x="498" y="718" width="92" height="22" rx="11" class="hi"/><text class="mc hi-t" x="544" y="733" text-anchor="middle">reuse · high</text>
  <rect x="596" y="718" width="110" height="22" rx="11" class="hi"/><text class="mc hi-t" x="651" y="733" text-anchor="middle">leanness · high</text>
  <rect x="388" y="746" width="118" height="22" rx="11" class="hi"/><text class="mc hi-t" x="447" y="761" text-anchor="middle">efficiency · high</text>
  <text class="note mut" x="514" y="761">4 lenses record findings, edit nothing</text>

  <line class="ln" x1="742" y1="742" x2="770" y2="742" stroke="#D9852E" marker-end="url(#ah-amber)"/>
  <rect x="772" y="716" width="146" height="54" rx="10" fill="#fff" stroke="#E7C79B"/>
  <text class="nlbl" fill="#B5701E" x="845" y="738" text-anchor="middle">Fixer</text>
  <rect x="797" y="746" width="96" height="18" rx="9" class="me"/><text class="mc me-t" x="845" y="759" text-anchor="middle">opus · medium</text>

  <line class="ln" x1="920" y1="742" x2="948" y2="742" stroke="#D9852E" marker-end="url(#ah-amber)"/>
  <rect x="950" y="716" width="130" height="54" rx="10" fill="#fff" stroke="#E7C79B"/>
  <text class="nlbl" fill="#B5701E" x="1015" y="738" text-anchor="middle">gate + judge</text>
  <text class="nsub mut" x="1015" y="756" text-anchor="middle">same as every task</text>

  <line class="ln" x1="1082" y1="742" x2="1110" y2="742" stroke="#2F9C70" marker-end="url(#ah-green)"/>
  <rect x="1112" y="716" width="112" height="54" rx="10" fill="#E9F7F0" stroke="#A9DCC4"/>
  <text class="nlbl" fill="#2F9C70" x="1168" y="748" text-anchor="middle">Ship 🚀</text>

  <!-- ===== EFFORT RULE ===== -->
  <rect x="60" y="820" width="1200" height="56" rx="12" fill="#fff" stroke="#D7E3EA"/>
  <text class="nlbl ink" x="84" y="843">Build at low effort, hunt at high.</text>
  <text class="note mut" x="84" y="863">Effort buys self-checking and edge-case hunting. It does not fix a wrong approach, so builders run low and the steps that look for problems run high.</text>
  <rect x="960" y="833" width="64" height="20" rx="10" class="lo"/><text class="mc lo-t" x="992" y="847" text-anchor="middle">low</text>
  <rect x="1032" y="833" width="72" height="20" rx="10" class="me"/><text class="mc me-t" x="1068" y="847" text-anchor="middle">medium</text>
  <rect x="1112" y="833" width="64" height="20" rx="10" class="hi"/><text class="mc hi-t" x="1144" y="847" text-anchor="middle">high</text>
  <text class="note mut" x="1184" y="847">effort</text>
</svg>
